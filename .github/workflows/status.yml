name: Project Status Automation V1

on:
  push:
    paths:
      - 'Documentation-repo/**'
      - 'Documentation-repo/tools/status/**'
      - 'Documentation-repo/tests/status/**'
      - '.github/workflows/status.yml'
  workflow_dispatch:

concurrency:
  group: status-automation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronise with latest branch
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run status automation tests
        run: |
          python -m unittest discover \
            -s Documentation-repo/tests/status \
            -p 'test_*.py'

      - name: Generate project status
        run: |
          python Documentation-repo/tools/status/processor.py \
            --root Documentation-repo

      - name: Commit generated status
        run: |
          if git diff --quiet -- Documentation-repo/PROJECT_STATUS.md; then
            exit 0
          fi

          git config user.name 'Project Status Automation V1'
          git config user.email 'actions@users.noreply.github.com'

          git add Documentation-repo/PROJECT_STATUS.md
          git commit -m 'docs: update project status'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"