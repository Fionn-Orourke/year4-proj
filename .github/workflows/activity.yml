name: Git Activity Automation V1

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: automation-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronise with latest main
        run: |
        git fetch origin main
        git checkout main
        git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run activity automation tests
        run: python -m unittest discover -s Documentation-repo/tests/activity -p 'test_*.py'

      - name: Generate activity drafts
        run: python Documentation-repo/tools/activity/processor.py --root Documentation-repo

      - name: Commit generated activity records
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name 'Activity Automation V1'
          git config user.email 'actions@users.noreply.github.com'

          git add Documentation-repo/development/ACT-*.md
          git commit -m 'docs: generate activity records'
          git push